spring.application.name=todoapp
spring.datasource.url=jdbc:mysql://localhost:3307/todoapp?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:password}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.ai.mcp.server.protocol=STREAMABLE
# Web画面はMCPサーバーを利用しないため、Boot 3系では自動起動を無効化する
spring.ai.mcp.server.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerStreamableHttpWebMvcAutoConfiguration,org.springframework.ai.mcp.server.common.autoconfigure.McpServerJsonMapperAutoConfiguration,org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerAnnotationScannerAutoConfiguration,org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerSpecificationFactoryAutoConfiguration
