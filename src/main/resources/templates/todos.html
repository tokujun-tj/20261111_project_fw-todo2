<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=dark-mode-1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        (function () {
            const key = 'todo-theme';
            let saved = null;
            try { saved = localStorage.getItem(key); } catch (error) {}
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/js/theme.js?v=dark-mode-1" defer></script>
</head>
<body>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え" title="ダークモード">
    <span class="material-icons dark-icon" aria-hidden="true">dark_mode</span>
    <span class="material-icons light-icon" aria-hidden="true">light_mode</span>
</button>
<main class="container">
    <section class="statistics" aria-labelledby="statistics-title">
        <h2 id="statistics-title" class="section-title">タスク分布</h2>
        <div class="chart-grid">
            <article class="chart-card">
                <h3>カテゴリ別</h3>
                <div class="chart-wrapper">
                    <canvas id="category-chart" aria-label="カテゴリ別タスク数"></canvas>
                    <span id="todo-total" class="chart-total" aria-live="polite">0</span>
                </div>
            </article>
            <article class="chart-card">
                <h3>優先度別</h3>
                <div class="chart-wrapper">
                    <canvas id="priority-chart" aria-label="優先度別タスク数"></canvas>
                </div>
            </article>
        </div>
        <p id="statistics-error" class="error" hidden>集計データを取得できませんでした。</p>
    </section>
    <div class="user-bar">
        <span sec:authorize="isAuthenticated()" th:text="|ログイン中: ${#authentication.name}|">ログイン中</span>
        <form th:action="@{/logout}" method="post">
            <button class="link-button" type="submit">ログアウト</button>
        </form>
    </div>
    <h1 class="page-title">やること一覧</h1>

    <p class="flash" th:if="${message != null}" th:text="${message}">登録しました</p>

    <form class="search-bar" method="get" action="/todos">
        <label class="form-label" for="keyword">やることの名前</label>
        <input class="form-input" id="keyword" name="keyword" type="text" th:value="${keyword}">

        <label class="form-label" for="category">ジャンル</label>
        <select class="form-input" id="category" name="category">
            <option value="すべて" th:selected="${category == 'すべて'}">すべて</option>
            <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
            <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
            <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
            <option value="資格" th:selected="${category == '資格'}">資格</option>
            <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            <option value="その他" th:selected="${category == 'その他'}">その他</option>
        </select>

        <input type="hidden" name="order" th:value="${order}">
        <button class="btn" type="submit">絞り込む</button>
    </form>

    <p>
        <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc')}">期限が近い順</a>
        <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc')}">期限が遠い順</a>
    </p>
    <p class="deadline-legend" aria-label="期限の状態">
        <span class="deadline-legend-item deadline-legend-overdue">期限切れ</span>
        <span class="deadline-legend-item deadline-legend-soon">3日以内</span>
    </p>

    <p>
        <a class="btn" href="/todos/new">新規登録</a>
        <a class="btn sub" href="/calendar">カレンダーで見る</a>
    </p>

    <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>

    <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
        <thead>
        <tr>
            <th>やること</th>
            <th>ジャンル</th>
            <th>優先度</th>
            <th>期限</th>
            <th>状態</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="todo : ${todos}"
            th:with="today=${#temporals.createToday()}"
            th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(today) ? 'deadline-overdue' : (todo.dueDate != null and !todo.dueDate.isBefore(today) and !todo.dueDate.isAfter(today.plusDays(3)) ? 'deadline-soon' : '')}">
            <td th:text="${todo.title}">やること</td>
            <td th:text="${todo.category}">ジャンル</td>
            <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</td>
            <td th:text="${todo.dueDate == null ? '—' : #temporals.format(todo.dueDate, 'yyyy/MM/dd')}">期限</td>
            <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
            <td>
                <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script>
    (() => {
        const colors = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
        const priorityColors = { HIGH: '#ef4444', MEDIUM: '#f59e0b', LOW: '#10b981' };
        const totalLabel = {
            id: 'totalLabel',
            afterDraw(chart) {
                if (chart.canvas.id !== 'category-chart') return;
                document.getElementById('todo-total').textContent =
                    chart.data.datasets[0].data.reduce((sum, value) => sum + value, 0);
            }
        };
        Chart.register(totalLabel);

        const createChart = (canvasId, items, type) => {
            const labels = items.map(item => item.label);
            const values = items.map(item => item.count);
            const backgroundColor = type === 'pie'
                ? labels.map(label => priorityColors[label] || '#64748b')
                : labels.map((_, index) => colors[index % colors.length]);
            new Chart(document.getElementById(canvasId), {
                type,
                data: { labels, datasets: [{ data: values, backgroundColor, borderWidth: 2, borderColor: 'transparent' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        };

        Promise.all([
            fetch('/api/todos/stats/categories').then(response => response.ok ? response.json() : Promise.reject(response)),
            fetch('/api/todos/stats/priorities').then(response => response.ok ? response.json() : Promise.reject(response))
        ]).then(([categories, priorities]) => {
            createChart('category-chart', categories, 'doughnut');
            createChart('priority-chart', priorities, 'pie');
        }).catch(() => {
            document.getElementById('statistics-error').hidden = false;
        });
    })();
</script>
</body>
</html>
