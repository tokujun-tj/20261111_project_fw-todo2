<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container calendar-page">
    <h1 class="page-title" th:text="|${year}年${month}月|">2026年4月</h1>

    <nav class="calendar-navigation" aria-label="月の移動">
        <div class="calendar-navigation-group">
            <a class="btn sub" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
            <a class="btn sub" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
        </div>
        <div class="calendar-navigation-group">
            <a class="btn sub" href="/todos">表で見る</a>
            <a class="btn" href="/todos/new">新規登録</a>
        </div>
    </nav>

    <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
        <thead>
        <tr>
            <th scope="col">日</th>
            <th scope="col">月</th>
            <th scope="col">火</th>
            <th scope="col">水</th>
            <th scope="col">木</th>
            <th scope="col">金</th>
            <th scope="col">土</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="weekStart : ${#numbers.sequence(0, totalCells - 1, 7)}">
            <td th:each="dayOffset : ${#numbers.sequence(0, 6)}"
                th:with="dayNumber=${weekStart + dayOffset - startOffset + 1}, cellDate=${dayNumber >= 1 and dayNumber <= daysInMonth ? firstDay.plusDays(dayNumber - 1) : null}"
                th:attr="data-date=${cellDate}"
                th:text="${dayNumber >= 1 and dayNumber <= daysInMonth ? dayNumber : ''}">
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script>
    async function loadTodos() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const res = await fetch(`/api/todos?from=${from}&to=${to}`);
        const todos = await res.json();
        const today = new Date();
        const todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        calendar.querySelectorAll('td[data-date]').forEach(cell => {
            const matchingTodos = todos.filter(todo => cell.dataset.date === todo.dueDate);
            const visibleTodos = matchingTodos.slice(0, 3);

            visibleTodos.forEach(todo => {
                const todoName = document.createElement('a');
                todoName.href = `/todos/${todo.id}/edit`;
                todoName.className = 'link';
                todoName.textContent = todo.title;

                if (todo.dueDate < todayString && !todo.completed) {
                    todoName.style.color = '#b91c1c';
                }
                cell.appendChild(todoName);
            });

            const remainingCount = matchingTodos.length - visibleTodos.length;
            if (remainingCount > 0) {
                const remaining = document.createElement('div');
                remaining.textContent = `ほか ${remainingCount}件`;
                cell.appendChild(remaining);
            }
        });
    }

    async function loadHolidays() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
        const holidays = await res.json();

        if (res.headers.has('X-Holidays-Unavailable')) {
            const message = document.createElement('p');
            message.textContent = '祝日を取れませんでした';
            document.querySelector('main').prepend(message);
        }

        calendar.querySelectorAll('td[data-date]').forEach(cell => {
            const date = new Date(`${cell.dataset.date}T00:00:00`);
            const dayOfWeek = date.getDay();
            const holidayName = holidays[cell.dataset.date];

            if (holidayName) {
                cell.style.backgroundColor = '#fef3c7';
                cell.title = holidayName;
            } else if (dayOfWeek === 0) {
                cell.style.backgroundColor = '#fee2e2';
            } else if (dayOfWeek === 6) {
                cell.style.backgroundColor = '#dbeafe';
            }
        });
    }

    loadTodos();
    loadHolidays();
</script>
</body>
</html>
