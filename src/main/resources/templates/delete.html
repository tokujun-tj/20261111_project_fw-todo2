<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること削除確認</title>
    <link rel="stylesheet" href="/css/style.css?v=dark-mode-1">
    <script>
        (function () {
            const key = 'todo-theme';
            let saved = null;
            try { saved = localStorage.getItem(key); } catch (error) {}
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/js/theme.js?v=dark-mode-1" defer></script>
</head>
<body>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え" title="ダークモード">
    <span class="material-icons dark-icon" aria-hidden="true">dark_mode</span>
    <span class="material-icons light-icon" aria-hidden="true">light_mode</span>
</button>
<main class="container">
    <h1 class="page-title">やること削除確認</h1>

    <p class="confirm-value">やること：<span th:text="${todo.title}">やること</span></p>
    <p class="confirm-value">ジャンル：<span th:text="${todo.category}">ジャンル</span></p>
    <p class="confirm-value">期限：<span th:text="${todo.dueDate}">期限</span></p>

    <div class="confirm-actions">
        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
            <button class="btn" type="submit">消す</button>
        </form>
        <a class="btn sub" href="/todos">やめる</a>
    </div>
</main>
</body>
</html>
