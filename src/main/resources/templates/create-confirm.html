<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること登録確認</title>
    <link rel="stylesheet" href="/css/style.css?v=dark-mode-1">
    <script>
        (function () {
            const key = 'todo-theme';
            let saved = null;
            try { saved = localStorage.getItem(key); } catch (error) {}
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/js/theme.js?v=dark-mode-1" defer></script>
</head>
<body>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え" title="ダークモード">
    <span class="material-icons dark-icon" aria-hidden="true">dark_mode</span>
    <span class="material-icons light-icon" aria-hidden="true">light_mode</span>
</button>
<main class="container">
    <h1 class="page-title">やること登録確認</h1>

    <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">（入力なし）</span></p>
    <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">（入力なし）</span></p>
    <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">（入力なし）</span></p>
    <p class="confirm-value">優先度：<span th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}">（入力なし）</span></p>
    <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>

    <div class="confirm-actions">
        <form th:action="@{/todos}" th:object="${todo}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <button class="btn" type="submit">登録する</button>
        </form>

        <form th:action="@{/todos/new}" th:object="${todo}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <button class="btn sub" type="submit">書き直す</button>
        </form>
    </div>
</main>
</body>
</html>
