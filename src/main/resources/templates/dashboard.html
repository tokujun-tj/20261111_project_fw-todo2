<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード | ToDo</title>
    <link rel="stylesheet" href="/css/style.css?v=dashboard-1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        (function () {
            const key = 'todo-theme';
            let saved = null;
            try { saved = localStorage.getItem(key); } catch (error) {}
            document.documentElement.dataset.theme = saved ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        })();
    </script>
    <script src="/js/theme.js?v=dashboard-1" defer></script>
</head>
<body>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="テーマ切り替え">テーマ</button>
<main class="container dashboard">
    <nav class="dashboard-nav"><a class="link" href="/todos">ToDo一覧</a><a class="btn" href="/todos/new">新規登録</a></nav>
    <header class="dashboard-header"><p class="eyebrow">OVERVIEW</p><h1 class="page-title">ダッシュボード</h1><p class="dashboard-lead">タスクの状況をひと目で確認できます。</p></header>
    <section class="stat-grid" aria-label="タスク統計">
        <article class="stat-card stat-card-total"><span>全タスク</span><strong th:text="${stats.total}">0</strong><small>登録済み</small></article>
        <article class="stat-card stat-card-completed"><span>完了</span><strong th:text="${stats.completed}">0</strong><small>完了済みタスク</small></article>
        <article class="stat-card stat-card-incomplete"><span>未完了</span><strong th:text="${stats.incomplete}">0</strong><small>対応が必要</small></article>
        <article class="stat-card stat-card-overdue"><span>期限切れ</span><strong th:text="${stats.overdue}">0</strong><small>未完了・期限超過</small></article>
    </section>
    <section class="dashboard-grid" aria-label="タスクチャート">
        <article class="chart-card chart-card-wide"><div class="chart-heading"><h2>直近7日間の完了数</h2><span>日別</span></div><div class="dashboard-chart"><canvas id="completion-chart"></canvas></div></article>
        <article class="chart-card"><div class="chart-heading"><h2>ステータス別</h2><span>割合</span></div><div class="dashboard-chart dashboard-chart-doughnut"><canvas id="status-chart"></canvas></div></article>
        <article class="chart-card chart-card-wide"><div class="chart-heading"><h2>カテゴリ別タスク数</h2><span>件数</span></div><div class="dashboard-chart"><canvas id="category-chart"></canvas></div></article>
    </section>
</main>
<script th:inline="javascript">
    const completionData = /*[[${stats.completionByDay}]]*/ [];
    const statusData = /*[[${stats.statusCounts}]]*/ [];
    const categoryData = /*[[${stats.categoryCounts}]]*/ [];
    const chartText = getComputedStyle(document.documentElement).getPropertyValue('--color-text').trim();
    const chartGrid = getComputedStyle(document.documentElement).getPropertyValue('--color-border-soft').trim();
    const labels = items => items.map(item => item.label);
    const values = items => items.map(item => item.count);
    const common = { responsive: true, maintainAspectRatio: false };
    new Chart(document.getElementById('completion-chart'), { type: 'bar', data: { labels: labels(completionData).map(label => label.substring(5).replace('-', '/')), datasets: [{ label: '完了数', data: values(completionData), backgroundColor: '#6366f1', borderRadius: 5, maxBarThickness: 42 }] }, options: { ...common, scales: { x: { grid: { display: false }, ticks: { color: chartText } }, y: { beginAtZero: true, ticks: { precision: 0, color: chartText }, grid: { color: chartGrid } } }, plugins: { legend: { display: false } } } });
    new Chart(document.getElementById('status-chart'), { type: 'doughnut', data: { labels: labels(statusData), datasets: [{ data: values(statusData), backgroundColor: ['#10b981', '#f59e0b'], borderWidth: 0 }] }, options: { ...common, cutout: '68%', plugins: { legend: { position: 'bottom', labels: { color: chartText, usePointStyle: true, padding: 18 } } } } });
    new Chart(document.getElementById('category-chart'), { type: 'bar', data: { labels: labels(categoryData), datasets: [{ label: 'タスク数', data: values(categoryData), backgroundColor: '#0ea5e9', borderRadius: 5, barThickness: 24 }] }, options: { ...common, indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { precision: 0, color: chartText }, grid: { color: chartGrid } }, y: { ticks: { color: chartText }, grid: { display: false } } }, plugins: { legend: { display: false } } } });
</script>
</body>
</html>
