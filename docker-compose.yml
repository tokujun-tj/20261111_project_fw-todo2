services:
  db:
    image: mysql:8.0
    container_name: fw2-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - fw-db-data:/var/lib/mysql

volumes:
  fw-db-data:
